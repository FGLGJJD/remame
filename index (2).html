<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark light">
<title>NETRUN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif;--r-l:28px;--r-m:20px;--r-s:14px;--ease:cubic-bezier(.2,.8,.2,1);--t:150ms;--nav-h:66px;--sab:env(safe-area-inset-bottom);--sat:env(safe-area-inset-top)}
[data-theme="dark"]{--bg:#0c0d0f;--bg-hi:#1a1c20;--glass:rgba(255,255,255,.055);--glass-2:rgba(255,255,255,.10);--glass-solid:#17191c;--line:rgba(255,255,255,.09);--line-hi:rgba(255,255,255,.16);--text:#f1f2f4;--text-2:rgba(236,239,244,.60);--text-3:rgba(236,239,244,.36);--mark:#c8cbd1;--ok:#a6dcb9;--warn:#e9c08f;--bad:#ef9d9d;--scrim:rgba(0,0,0,.5)}
[data-theme="light"]{--bg:#e9ebee;--bg-hi:#f8f9fb;--glass:rgba(255,255,255,.55);--glass-2:rgba(255,255,255,.78);--glass-solid:#f6f7f9;--line:rgba(18,22,30,.08);--line-hi:rgba(255,255,255,.95);--text:#14161a;--text-2:rgba(20,22,26,.58);--text-3:rgba(20,22,26,.38);--mark:#3b3f47;--ok:#2e8a55;--warn:#a96f22;--bad:#bf4545;--scrim:rgba(20,24,32,.25)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased;transition:background-color .35s var(--ease),color .35s var(--ease)}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;background:radial-gradient(120% 60% at 50% -10%,var(--bg-hi) 0%,var(--bg) 60%) fixed}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.hidden{display:none!important}
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--line-hi);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
.no-blur .glass,.no-blur .nav,.no-blur .sheet{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--glass-solid)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.nav,.sheet{background:var(--glass-solid)}}
.tap{transition:transform var(--t) var(--ease),background-color var(--t) var(--ease),opacity var(--t) var(--ease),filter var(--t) var(--ease);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tap.pressed{transform:scale(.97);filter:brightness(1.12)}
#view{padding:calc(20px + var(--sat)) 18px calc(var(--nav-h) + 76px + var(--sab));max-width:720px;margin:0 auto;position:relative;min-height:100dvh}
.screen{animation:fade .28s var(--ease) both;position:relative}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wm{position:fixed;right:-40px;top:22%;pointer-events:none;z-index:0;color:var(--mark)}
.screen>*{position:relative;z-index:1}
/* home */
.home{display:flex;flex-direction:column;min-height:calc(100dvh - var(--nav-h) - 140px - var(--sat) - var(--sab));justify-content:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.34em;font-size:15px;color:var(--text)}
.brand svg{color:var(--text)}
.date{margin-top:26px;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.phrase{margin-top:8px;font-size:15px;color:var(--text-2);min-height:20px}
.phrase.in{animation:phrase .9s var(--ease) both}
@keyframes phrase{from{opacity:0;filter:blur(4px);transform:translateY(4px)}to{opacity:1;filter:none;transform:none}}
.composer{margin-top:28px;border-radius:var(--r-l);padding:8px 8px 8px 18px;display:flex;align-items:flex-end;gap:8px;transition:box-shadow .25s var(--ease),border-color .25s var(--ease)}
.composer:focus-within{border-color:var(--line-hi);box-shadow:inset 0 1px 0 var(--line-hi),0 0 0 4px var(--glass)}
.composer textarea{flex:1;background:none;border:0;outline:0;resize:none;font-size:17px;line-height:1.4;padding:12px 0;max-height:160px;min-height:48px}
.composer textarea::placeholder{color:var(--text-3)}
.send{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--text);color:var(--bg);flex:none}
.send[disabled]{opacity:.35}
.result{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.chip{border-radius:var(--r-m);padding:12px 14px;display:flex;align-items:center;gap:12px;animation:fade .25s var(--ease) both}
.chip .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--glass-2);flex:none}
.chip .tx{flex:1;min-width:0}
.chip .tx b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .tx span{font-size:12px;color:var(--text-2)}
.chip select{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;color:var(--text-2);max-width:120px}
.msg{font-size:14px;color:var(--text-2);padding:4px 6px;line-height:1.45}
.msg.warn{color:var(--warn)}
.plus-pill{margin-top:22px;align-self:flex-start;border-radius:999px;padding:9px 16px 9px 12px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.06em}
.plus-pill i{font-style:normal;color:var(--text-3);font-weight:400;letter-spacing:0}
/* sections */
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.head h1{font-size:30px;font-weight:600;letter-spacing:-.02em}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.card{border-radius:var(--r-m);padding:16px;margin-bottom:12px}
.label{font-size:12px;color:var(--text-2);letter-spacing:.02em}
.big{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.row2 .card{margin-bottom:0}
.sub{font-size:13px;color:var(--text-2);margin-top:4px}
.bar{height:6px;border-radius:6px;background:var(--glass-2);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--text);width:0;transition:width .7s var(--ease)}
.bar.over>i{background:var(--bad)}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:16px;margin-bottom:14px;gap:4px}
.tabs button{padding:10px;border-radius:12px;font-size:14px;color:var(--text-2);transition:background-color .2s var(--ease),color .2s var(--ease)}
.tabs button[aria-selected="true"]{background:var(--glass-2);color:var(--text);box-shadow:inset 0 1px 0 var(--line-hi)}
.tabs .n{color:var(--text-3);margin-left:6px;font-size:12px}
.list{border-radius:var(--r-m);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);min-height:56px;transition:opacity .22s var(--ease),transform .22s var(--ease)}
.item:first-child{border-top:0}
.item.leaving{opacity:0;transform:translateX(16px)}
.item .main{flex:1;min-width:0}
.item .t{font-size:15px;line-height:1.3;word-break:break-word}
.item .m{font-size:12px;color:var(--text-2);margin-top:3px}
.item .v{font-size:15px;font-weight:500;white-space:nowrap}
.item .v.plus{color:var(--ok)}
.item.done .t{color:var(--text-3);text-decoration:line-through}
.over-c{color:var(--bad)}
.grp{font-size:12px;color:var(--text-3);margin:18px 4px 8px;letter-spacing:.03em;text-transform:uppercase}
.check{width:26px;height:26px;border-radius:9px;border:1.5px solid var(--line-hi);display:grid;place-items:center;flex:none;transition:background-color .2s var(--ease),border-color .2s var(--ease)}
[data-theme="light"] .check{border-color:rgba(20,22,26,.25)}
.check svg{opacity:0;transform:scale(.4);transition:opacity .2s var(--ease),transform .25s var(--ease)}
.check.on{background:var(--text);border-color:var(--text)}
.check.on svg{opacity:1;transform:none;color:var(--bg)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--text-3)}
.dot.high{background:var(--bad)}.dot.med{background:var(--warn)}
.empty{text-align:center;padding:56px 20px;color:var(--text-2);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:16px}
.empty svg{color:var(--mark)}
.search{width:100%;border-radius:16px;padding:12px 14px;border:1px solid var(--line);background:var(--glass);outline:0;margin-bottom:12px}
.pin{color:var(--text-3)}.pin.on{color:var(--text)}
.cat-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
.cat-row span:last-child{color:var(--text-2)}
.note{font-size:12px;color:var(--text-3);margin:10px 4px;line-height:1.5}
/* plus */
.plus-head{text-align:center;padding:12px 0 8px}
.plus-head h1{font-size:34px;letter-spacing:.18em;font-weight:600}
.plus-head p{color:var(--text-2);margin-top:10px;font-size:15px;line-height:1.45}
.plans{display:grid;gap:10px;margin:22px 0}
.plan{border-radius:var(--r-m);padding:16px 18px;display:flex;align-items:center;gap:14px;text-align:left;width:100%;transition:transform var(--t) var(--ease),border-color .25s var(--ease),background-color .25s var(--ease)}
.plan .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-hi);display:grid;place-items:center;flex:none}
.plan .radio i{width:10px;height:10px;border-radius:50%;background:var(--text);transform:scale(0);transition:transform .25s var(--ease)}
.plan.sel{border-color:var(--line-hi);background:var(--glass-2)}
.plan.sel .radio i{transform:scale(1)}
.plan .pn{flex:1}.plan .pn b{display:block;font-weight:600;font-size:16px}.plan .pn span{font-size:12px;color:var(--text-2)}
.plan .pp{text-align:right}.plan .pp b{display:block;font-size:17px;font-weight:600}.plan .pp span{font-size:12px;color:var(--text-2)}
.feat{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px;color:var(--text-2)}
.tag{margin-left:auto;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--text-3)}
.btn{width:100%;border-radius:18px;padding:15px;font-weight:600;font-size:16px;background:var(--text);color:var(--bg)}
.btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}.kv span:first-child{color:var(--text-2)}
/* settings */
.set{border-radius:var(--r-m);margin-bottom:12px;overflow:hidden}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:54px}
.set-row:first-child{border-top:0}
.set-row>span{font-size:15px}
.seg{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 11px;border-radius:9px;font-size:13px;color:var(--text-2);transition:background-color .2s var(--ease),color .2s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--glass-2);color:var(--text);box-shadow:inset 0 1px 0 var(--line-hi)}
.inp{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:9px 11px;outline:0;max-width:150px;text-align:right}
.inp:focus,.f-in:focus{border-color:var(--line-hi)}
.sw{width:50px;height:30px;border-radius:999px;background:var(--glass-2);position:relative;flex:none;transition:background-color .25s var(--ease);border:1px solid var(--line)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{background:var(--text-2)}
.sw[aria-checked="true"] i{transform:translateX(20px);background:var(--bg)}
/* nav */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(8px + var(--sab));pointer-events:none}
.dock>*{pointer-events:auto}
.mini{display:flex;justify-content:space-between;max-width:720px;margin:0 auto 8px;padding:0 4px}
.mini button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text-2)}
.mini button[aria-current="page"]{color:var(--text);background:var(--glass-2)}
.nav{max-width:720px;margin:0 auto;border-radius:24px;display:grid;grid-template-columns:repeat(6,1fr);padding:6px;gap:2px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:54px;border-radius:18px;color:var(--text-2);font-size:10.5px;letter-spacing:.01em;min-width:0}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--text);background:var(--glass-2);box-shadow:inset 0 1px 0 var(--line-hi)}
@media (max-width:359px){.nav{grid-template-columns:repeat(3,1fr)}#view{padding-bottom:calc(var(--nav-h)*2 + 70px + var(--sab))}}
@media (min-width:900px){#view{padding-top:48px}.home .date{font-size:36px}}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fadeo .2s var(--ease) both}
@keyframes fadeo{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:720px;margin:0 auto;border-radius:28px 28px 0 0;padding:10px 18px calc(18px + var(--sab));max-height:88dvh;overflow:auto;background:var(--glass-solid);border:1px solid var(--line);animation:up .28s var(--ease) both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line-hi);margin:0 auto 14px}
.sheet h2{font-size:20px;font-weight:600;margin-bottom:14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--text-2);margin:0 0 6px 4px}
.f-in{width:100%;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 13px;outline:0;font-size:16px}
textarea.f-in{min-height:110px;resize:vertical}
select.f-in{appearance:none;-webkit-appearance:none}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;top:calc(14px + var(--sat));transform:translateX(-50%);z-index:60;border-radius:999px;padding:10px 18px;font-size:14px;animation:fade .25s var(--ease) both;max-width:90vw;text-align:center}
.state{text-align:center;padding:30vh 24px 0;color:var(--text-2)}
.state b{display:block;color:var(--text);font-size:18px;margin-bottom:8px;font-weight:600}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-hi);border-top-color:var(--text);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.reduce *,.reduce *::before,.reduce *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
</head>

  <nav class="nav glass" id="nav" aria-label="Sections"></nav>
</div>
<div id="layer"></div>

      d.p += Number(r.protein) || 0; d.f += Number(r.fat) || 0; d.c += Number(r.carbs) || 0;
      d.items.push(r);
    });
    var td = days[tk] || { min: 0, max: 0, unknown: 0, items: [], exact: true, p: 0, f: 0, c: 0 };
    var goal = Number(S.kcalGoal) || 0, mid = Math.round((td.min + td.max) / 2), left = goal - mid, pct = goal ? Math.min(100, mid / goal * 100) : 0;

  /* ---------- home actions ---------- */
  function send() {

    hap('light'); render();
    api({ action: 'ai', text: full }).then(function (d) {
      if (d.clarify) { homeState = { busy: false, result: null, clarify: d.clarify, pending: full, aiOff: '' }; hap('select'); render(); var c = q('#cmp'); if (c) c.focus(); return; }

      homeState = { busy: false, result: created, clarify: null, pending: '', aiOff: '' };
      hap('success'); render();
    }).catch(function (e) {
      if (e.message === 'ai_unavailable') homeState = { busy: false, result: null, clarify: null, pending: full, aiOff: '1', draft: '' };

    var nowDone = !r.done, fields = { done: nowDone, completed_at: nowDone ? new Date().toISOString() : null };
    hap(nowDone ? 'success' : 'light');
    var item = q('[data-row="' + id + '"]'), box = item && item.querySelector('.check');
    if (box) { box.classList.toggle('on', nowDone); box.setAttribute('aria-checked', String(nowDone)); }
    Object.assign(r, fields); persist();
    var a = D.tasks.filter(function (x) { return !x.done; }).length;
    if (q('#cntA')) q('#cntA').textContent = a;
    if (q('#cntD')) q('#cntD').textContent = D.tasks.length - a;

    api({ action: 'update', table: 'tasks', rowId: r.id, fields: fields }).then(function (d) {
      if (d.row) Object.assign(r, d.row); persist(); delete toggling[id];
